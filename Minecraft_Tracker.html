<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Server Tracker</title>

<link rel="stylesheet" href="Minecraft_Tracker.css"> 

</head>

<body>

    <div class="InfoSection">

    <h1 class="heading">🎮 Minecraft Server Tracker</h1>

    <input type="text" id="serverInput" placeholder="your.server.net">

    <button onclick="searchServer()"> Check Server </button>

    <div class="infoCard">
    <div class="text" id="ip">
    IP: -
    </div>
    </div>

    <div class="infoCard">
    <div class="text" id="port">
    Port: -
    </div>
    </div>

    <div class="infoCard">
    <div class="text" id="onlineStatus">
    Status: -
    </div>
    </div>

    <div class="infoCard">
    <div class="text" id="playerCount">
    Spieler: -
    </div>
    </div>

    <div class="infoCard">
    <div class="text" id="infoText">
    Info: -
    </div>
    </div>

    </div>


    <script src="Minecraft_Tracker.js"> </script>

</body>
</html>
